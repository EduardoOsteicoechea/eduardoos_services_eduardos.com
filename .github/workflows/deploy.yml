name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE: eduardoos.com
      API_PORT: "8081"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Astro frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Run Go tests
        working-directory: backend
        run: go test ./...

      - name: Compile Linux AMD64 API
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o api .

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path

          home = Path.home() / ".ssh"
          key = os.environ["VPS_SSH_KEY"].replace("\r\n", "\n").replace("\r", "\n")
          if "BEGIN" not in key and "\\n" in key:
              key = key.replace("\\n", "\n")
          key = key.strip() + "\n"
          if "BEGIN" not in key or "PRIVATE KEY" not in key:
              raise SystemExit(
                  "VPS_SSH_KEY is not a private key. Paste the full OpenSSH private key, not the .pub file or a password."
              )
          path = home / "deploy_key"
          path.write_text(key)
          path.chmod(0o600)
          hosts = os.environ["VPS_KNOWN_HOSTS"].replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"
          known = home / "known_hosts"
          known.write_text(hosts)
          known.chmod(0o644)
          PY
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null
          echo "Deploy key fingerprint:"
          ssh-keygen -lf "$HOME/.ssh/deploy_key"
          {
            echo "SSH_KEY_PATH=$HOME/.ssh/deploy_key"
            echo "SSH_KNOWN_HOSTS_PATH=$HOME/.ssh/known_hosts"
          } >> "$GITHUB_ENV"

      - name: Upload frontend dist
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          RSH="ssh -i ${SSH_KEY_PATH} -p ${PORT} -o IdentitiesOnly=yes -o BatchMode=yes -o PreferredAuthentications=publickey -o UserKnownHostsFile=${SSH_KNOWN_HOSTS_PATH} -o StrictHostKeyChecking=yes"
          rsync -az --delete -e "${RSH}" \
            frontend/dist/ \
            "${VPS_USER}@${VPS_HOST}:/var/www/${SITE}/html/"

      - name: Upload API binary and switch release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          RSH="ssh -i ${SSH_KEY_PATH} -p ${PORT} -o IdentitiesOnly=yes -o BatchMode=yes -o PreferredAuthentications=publickey -o UserKnownHostsFile=${SSH_KNOWN_HOSTS_PATH} -o StrictHostKeyChecking=yes"
          SHA="${GITHUB_SHA}"
          RELEASE="/opt/apps/${SITE}/releases/${SHA}"
          ${RSH} "${VPS_USER}@${VPS_HOST}" "mkdir -p '${RELEASE}'"
          rsync -az -e "${RSH}" \
            backend/api \
            "${VPS_USER}@${VPS_HOST}:${RELEASE}/api"
          ${RSH} "${VPS_USER}@${VPS_HOST}" "chmod +x '${RELEASE}/api' && ln -sfn '${RELEASE}' '/opt/apps/${SITE}/current.tmp' && mv -Tf '/opt/apps/${SITE}/current.tmp' '/opt/apps/${SITE}/current'"

      - name: Restart API and verify health
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          RSH="ssh -i ${SSH_KEY_PATH} -p ${PORT} -o IdentitiesOnly=yes -o BatchMode=yes -o PreferredAuthentications=publickey -o UserKnownHostsFile=${SSH_KNOWN_HOSTS_PATH} -o StrictHostKeyChecking=yes"
          ${RSH} "${VPS_USER}@${VPS_HOST}" "sudo systemctl restart '${SITE}-api.service' && curl --fail 'http://127.0.0.1:${API_PORT}/health'"
