name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.resolve.outputs.frontend }}
      backend: ${{ steps.resolve.outputs.backend }}
      android: ${{ steps.resolve.outputs.android }}
      desktop: ${{ steps.resolve.outputs.desktop }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve deploy scope
        id: resolve
        run: |
          set -euo pipefail
          frontend=false
          backend=false
          android=false
          desktop=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            frontend=true
            backend=true
            android=true
            desktop=true
            echo "Deploy scope (manual): frontend + backend + android + desktop"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              frontend=true
              backend=true
              android=true
              desktop=true
              echo "Deploy scope (no base commit): frontend + backend + android + desktop"
            else
              CHANGED="$(git diff --name-only "$BEFORE" "$AFTER" || true)"
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                case "$f" in
                  frontend/*) frontend=true ;;
                  # Calvin Institutes pack is frozen on the VPS — never sync or treat as backend.
                  backend/.data/calvin-institutes-paragraphs/*) ;;
                  backend/*) backend=true ;;
                  android/*) android=true ;;
                  desktop/*) desktop=true ;;
                esac
              done <<< "$CHANGED"
              echo "Changed paths:"
              printf '%s\n' "$CHANGED"
              echo "Deploy scope: frontend=${frontend} backend=${backend} android=${android} desktop=${desktop}"
            fi
          fi

          {
            echo "frontend=${frontend}"
            echo "backend=${backend}"
            echo "android=${android}"
            echo "desktop=${desktop}"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: scope
    if: needs.scope.outputs.frontend == 'true' || needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      SITE: eduardoos.com
      APP: eduardoos
      SERVICE: eduardoos-api.service
      API_PORT: "8081"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        if: needs.scope.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Astro frontend
        if: needs.scope.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Go
        if: needs.scope.outputs.backend == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Run Go tests
        if: needs.scope.outputs.backend == 'true'
        working-directory: backend
        run: go test ./...

      - name: Compile Linux AMD64 API
        if: needs.scope.outputs.backend == 'true'
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o api .

      - name: Configure SSH
        if: needs.scope.outputs.frontend == 'true' || needs.scope.outputs.backend == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path

          home = Path.home() / ".ssh"
          key = os.environ["VPS_SSH_KEY"].replace("\r\n", "\n").replace("\r", "\n")
          if "BEGIN" not in key and "\\n" in key:
              key = key.replace("\\n", "\n")
          key = key.strip() + "\n"
          if "BEGIN" not in key or "PRIVATE KEY" not in key:
              raise SystemExit(
                  "VPS_SSH_KEY is not a private key. Paste the full OpenSSH private key, not the .pub file or a password."
              )
          path = home / "deploy_key"
          path.write_text(key)
          path.chmod(0o600)
          hosts = os.environ["VPS_KNOWN_HOSTS"].replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"
          known = home / "known_hosts"
          known.write_text(hosts)
          known.chmod(0o644)
          PY
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null
          echo "Deploy key fingerprint:"
          ssh-keygen -lf "$HOME/.ssh/deploy_key"
          {
            echo "SSH_KEY_PATH=$HOME/.ssh/deploy_key"
            echo "SSH_KNOWN_HOSTS_PATH=$HOME/.ssh/known_hosts"
          } >> "$GITHUB_ENV"

      - name: Upload frontend dist
        if: needs.scope.outputs.frontend == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          RSH="ssh -i ${SSH_KEY_PATH} -p ${PORT} -o IdentitiesOnly=yes -o BatchMode=yes -o PreferredAuthentications=publickey -o UserKnownHostsFile=${SSH_KNOWN_HOSTS_PATH} -o StrictHostKeyChecking=yes"
          rsync -az --delete -e "${RSH}" \
            frontend/dist/ \
            "${VPS_USER}@${VPS_HOST}:/var/www/${SITE}/html/"

      - name: Upload API binary and switch release
        if: needs.scope.outputs.backend == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          RSH="ssh -i ${SSH_KEY_PATH} -p ${PORT} -o IdentitiesOnly=yes -o BatchMode=yes -o PreferredAuthentications=publickey -o UserKnownHostsFile=${SSH_KNOWN_HOSTS_PATH} -o StrictHostKeyChecking=yes"
          SHA="${GITHUB_SHA}"
          RELEASE="/opt/apps/${APP}/releases/${SHA}"
          ${RSH} "${VPS_USER}@${VPS_HOST}" "mkdir -p '${RELEASE}'"
          rsync -az -e "${RSH}" \
            backend/api \
            "${VPS_USER}@${VPS_HOST}:${RELEASE}/api"
          rsync -az -e "${RSH}" \
            backend/evoice-worker/ \
            "${VPS_USER}@${VPS_HOST}:${RELEASE}/evoice-worker/"
          ${RSH} "${VPS_USER}@${VPS_HOST}" "chmod +x '${RELEASE}/api' && ln -sfn '${RELEASE}' '/opt/apps/${APP}/current.tmp' && mv -Tf '/opt/apps/${APP}/current.tmp' '/opt/apps/${APP}/current'"

      - name: Restart API and verify health
        if: needs.scope.outputs.backend == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          RSH="ssh -i ${SSH_KEY_PATH} -p ${PORT} -o IdentitiesOnly=yes -o BatchMode=yes -o PreferredAuthentications=publickey -o UserKnownHostsFile=${SSH_KNOWN_HOSTS_PATH} -o StrictHostKeyChecking=yes"
          ${RSH} "${VPS_USER}@${VPS_HOST}" "sudo systemctl restart '${SERVICE}'"
          if ! ${RSH} "${VPS_USER}@${VPS_HOST}" "set -eu; i=0; while [ \"\$i\" -lt 30 ]; do if systemctl is-active --quiet '${SERVICE}' && curl --fail --silent --show-error http://127.0.0.1:${API_PORT}/health; then exit 0; fi; i=\$((i+1)); sleep 1; done; exit 1"; then
            ${RSH} "${VPS_USER}@${VPS_HOST}" "systemctl status '${SERVICE}' --no-pager" || true
            ${RSH} "${VPS_USER}@${VPS_HOST}" "journalctl -u '${SERVICE}' -n 100 --no-pager" || true
            exit 1
          fi

  android:
    needs: scope
    if: needs.scope.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Decode Android keystore
        env:
          EEYES_ANDROID_KEYSTORE_BASE64: ${{ secrets.EEYES_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${EEYES_ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$EEYES_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/eeyes.jks"
            echo "EEYES_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/eeyes.jks" >> "$GITHUB_ENV"
          else
            echo "No Android keystore secret; building unsigned release APK."
          fi
      - name: Build release APK
        working-directory: android
        env:
          EEYES_VERSION_CODE: ${{ github.run_number }}
          EEYES_VERSION_NAME: "1.0.${{ github.run_number }}"
          EEYES_BASE_URL: https://eduardoos.com
          EEYES_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.EEYES_ANDROID_KEYSTORE_PASSWORD }}
          EEYES_ANDROID_KEY_ALIAS: ${{ secrets.EEYES_ANDROID_KEY_ALIAS }}
          EEYES_ANDROID_KEY_PASSWORD: ${{ secrets.EEYES_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${EEYES_ANDROID_KEYSTORE_FILE:-}" ]; then
            gradle testReleaseUnitTest assembleRelease --no-daemon
          else
            gradle testReleaseUnitTest assembleRelease --no-daemon -x signReleaseBundle || gradle testReleaseUnitTest assembleRelease --no-daemon
          fi
          mkdir -p ../artifacts/android
          APK="$(find app/build/outputs/apk -name '*.apk' | head -n 1)"
          cp "$APK" ../artifacts/android/eeyes-android.apk
          sha256sum ../artifacts/android/eeyes-android.apk | awk '{print $1}' > ../artifacts/android/eeyes-android.apk.sha256
          cat > ../artifacts/android/latest.json <<EOF
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "sha256": "$(cat ../artifacts/android/eeyes-android.apk.sha256)",
            "size": $(wc -c < ../artifacts/android/eeyes-android.apk),
            "minVersionCode": 1,
            "notes": "",
            "file": "eeyes-android.apk"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: eeyes-android
          path: artifacts/android/

  desktop:
    needs: scope
    if: needs.scope.outputs.desktop == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test and publish
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:EEYES_BASE_URL = "https://eduardoos.com"
          dotnet test eEyes.sln -c Release
          dotnet publish eEyes.Desktop/eEyes.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ../artifacts/desktop/publish
          New-Item -ItemType Directory -Force -Path ../artifacts/desktop | Out-Null
          Copy-Item ../artifacts/desktop/publish/eEyes.exe ../artifacts/desktop/eeyes-desktop.exe
          $hash = (Get-FileHash ../artifacts/desktop/eeyes-desktop.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item ../artifacts/desktop/eeyes-desktop.exe).Length
          $code = ${{ github.run_number }}
          @"
          {
            "versionCode": $code,
            "versionName": "1.0.$code",
            "sha256": "$hash",
            "size": $size,
            "minVersionCode": 1,
            "notes": "",
            "file": "eeyes-desktop.exe"
          }
          "@ | Set-Content -Encoding utf8 ../artifacts/desktop/latest.json
      - name: Optional Authenticode sign
        shell: pwsh
        env:
          EEYES_WIN_CERT_PFX_BASE64: ${{ secrets.EEYES_WIN_CERT_PFX_BASE64 }}
          EEYES_WIN_CERT_PASSWORD: ${{ secrets.EEYES_WIN_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EEYES_WIN_CERT_PFX_BASE64)) {
            Write-Host "No Windows code-signing cert secret; skipping Authenticode."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "eeyes.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:EEYES_WIN_CERT_PFX_BASE64))
          & signtool sign /f $pfx /p $env:EEYES_WIN_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 artifacts/desktop/eeyes-desktop.exe
      - uses: actions/upload-artifact@v4
        with:
          name: eeyes-desktop
          path: artifacts/desktop/

  publish-apps:
    needs: [scope, android, desktop]
    if: |
      always() &&
      (needs.scope.outputs.android == 'true' || needs.scope.outputs.desktop == 'true') &&
      (needs.scope.outputs.android != 'true' || needs.android.result == 'success') &&
      (needs.scope.outputs.desktop != 'true' || needs.desktop.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path
          home = Path.home() / ".ssh"
          key = os.environ["VPS_SSH_KEY"].replace("\r\n", "\n").replace("\r", "\n")
          if "BEGIN" not in key and "\\n" in key:
              key = key.replace("\\n", "\n")
          key = key.strip() + "\n"
          path = home / "deploy_key"
          path.write_text(key)
          path.chmod(0o600)
          hosts = os.environ["VPS_KNOWN_HOSTS"].replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"
          known = home / "known_hosts"
          known.write_text(hosts)
          known.chmod(0o644)
          PY
          {
            echo "SSH_KEY_PATH=$HOME/.ssh/deploy_key"
            echo "SSH_KNOWN_HOSTS_PATH=$HOME/.ssh/known_hosts"
          } >> "$GITHUB_ENV"

      - name: Download Android artifact
        if: needs.scope.outputs.android == 'true'
        uses: actions/download-artifact@v4
        with:
          name: eeyes-android
          path: artifacts/android

      - name: Download Desktop artifact
        if: needs.scope.outputs.desktop == 'true'
        uses: actions/download-artifact@v4
        with:
          name: eeyes-desktop
          path: artifacts/desktop

      - name: Publish releases to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          PUBLISH_ANDROID: ${{ needs.scope.outputs.android }}
          PUBLISH_DESKTOP: ${{ needs.scope.outputs.desktop }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          RSH="ssh -i ${SSH_KEY_PATH} -p ${PORT} -o IdentitiesOnly=yes -o BatchMode=yes -o PreferredAuthentications=publickey -o UserKnownHostsFile=${SSH_KNOWN_HOSTS_PATH} -o StrictHostKeyChecking=yes"
          ROOT="/opt/apps/eduardoos/eeyes-releases"
          ${RSH} "${VPS_USER}@${VPS_HOST}" "mkdir -p '${ROOT}/android' '${ROOT}/desktop'"
          if [ "${PUBLISH_ANDROID}" = "true" ]; then
            VER="${{ github.run_number }}"
            ${RSH} "${VPS_USER}@${VPS_HOST}" "mkdir -p '${ROOT}/android/${VER}'"
            rsync -az -e "${RSH}" artifacts/android/eeyes-android.apk "${VPS_USER}@${VPS_HOST}:${ROOT}/android/${VER}/eeyes-android.apk"
            rsync -az -e "${RSH}" artifacts/android/latest.json "${VPS_USER}@${VPS_HOST}:${ROOT}/android/latest.json.tmp"
            ${RSH} "${VPS_USER}@${VPS_HOST}" "mv -Tf '${ROOT}/android/latest.json.tmp' '${ROOT}/android/latest.json'"
          fi
          if [ "${PUBLISH_DESKTOP}" = "true" ]; then
            VER="${{ github.run_number }}"
            ${RSH} "${VPS_USER}@${VPS_HOST}" "mkdir -p '${ROOT}/desktop/${VER}'"
            rsync -az -e "${RSH}" artifacts/desktop/eeyes-desktop.exe "${VPS_USER}@${VPS_HOST}:${ROOT}/desktop/${VER}/eeyes-desktop.exe"
            rsync -az -e "${RSH}" artifacts/desktop/latest.json "${VPS_USER}@${VPS_HOST}:${ROOT}/desktop/latest.json.tmp"
            ${RSH} "${VPS_USER}@${VPS_HOST}" "mv -Tf '${ROOT}/desktop/latest.json.tmp' '${ROOT}/desktop/latest.json'"
          fi
