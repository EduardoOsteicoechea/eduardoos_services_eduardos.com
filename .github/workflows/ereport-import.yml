name: Import eReport

# One-shot/manual: load legacy meta.json + report.json onto VPS media for an existing Mongo user.
# Report bodies live under /var/www/eduardoos.com/media/ereport (not Mongo documents).
# Mongo is used only to resolve the owner email → user id.

on:
  workflow_dispatch:
    inputs:
      email:
        description: Owner account email (must already exist in Mongo)
        required: true
        default: eduardooost@gmail.com
      org_name:
        description: Organization name
        required: true
        default: eduardoos.com
      meta_path:
        description: Path in repo to meta JSON
        required: true
        default: scripts/ereport-import-samples/meta.json
      payload_path:
        description: Path in repo to report JSON
        required: true
        default: scripts/ereport-import-samples/report.json

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      SITE: eduardoos.com
      APP: eduardoos
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path

          home = Path.home() / ".ssh"
          key = os.environ["VPS_SSH_KEY"].replace("\r\n", "\n").replace("\r", "\n")
          if "BEGIN" not in key and "\\n" in key:
              key = key.replace("\\n", "\n")
          key = key.strip() + "\n"
          if "BEGIN" not in key or "PRIVATE KEY" not in key:
              raise SystemExit("VPS_SSH_KEY is not a private key")
          path = home / "deploy_key"
          path.write_text(key)
          path.chmod(0o600)
          hosts = os.environ["VPS_KNOWN_HOSTS"].replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"
          known = home / "known_hosts"
          known.write_text(hosts)
          known.chmod(0o644)
          PY
          {
            echo "SSH_KEY_PATH=$HOME/.ssh/deploy_key"
            echo "SSH_KNOWN_HOSTS_PATH=$HOME/.ssh/known_hosts"
          } >> "$GITHUB_ENV"

      - name: Upload JSON and run ereport-import
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          IMPORT_EMAIL: ${{ inputs.email }}
          ORG_NAME: ${{ inputs.org_name }}
          META_PATH: ${{ inputs.meta_path }}
          PAYLOAD_PATH: ${{ inputs.payload_path }}
        run: |
          set -euo pipefail
          test -f "$META_PATH"
          test -f "$PAYLOAD_PATH"
          PORT="${VPS_PORT:-22}"
          RSH="ssh -i ${SSH_KEY_PATH} -p ${PORT} -o IdentitiesOnly=yes -o BatchMode=yes -o PreferredAuthentications=publickey -o UserKnownHostsFile=${SSH_KNOWN_HOSTS_PATH} -o StrictHostKeyChecking=yes"
          REMOTE_DIR="/tmp/ereport-import-${GITHUB_RUN_ID}"
          ${RSH} "${VPS_USER}@${VPS_HOST}" "mkdir -p '${REMOTE_DIR}'"
          rsync -az -e "${RSH}" "$META_PATH" "${VPS_USER}@${VPS_HOST}:${REMOTE_DIR}/meta.json"
          rsync -az -e "${RSH}" "$PAYLOAD_PATH" "${VPS_USER}@${VPS_HOST}:${REMOTE_DIR}/report.json"
          ${RSH} "${VPS_USER}@${VPS_HOST}" "set -euo pipefail
            API=/opt/apps/${APP}/current/api
            test -x \"\$API\"
            ENV_FILE=
            for f in /etc/eduardoos-api.env /etc/eduardoos.com-api.env; do
              if [ -r \"\$f\" ]; then ENV_FILE=\$f; break; fi
            done
            if [ -z \"\$ENV_FILE\" ]; then
              for f in /etc/eduardoos-api.env /etc/eduardoos.com-api.env; do
                if sudo -n test -r \"\$f\" 2>/dev/null; then
                  TMP_ENV=\$(mktemp)
                  sudo -n cat \"\$f\" > \"\$TMP_ENV\"
                  chmod 600 \"\$TMP_ENV\"
                  ENV_FILE=\$TMP_ENV
                  break
                fi
              done
            fi
            if [ -z \"\$ENV_FILE\" ]; then
              PID=\$(systemctl show -p MainPID --value eduardoos-api.service 2>/dev/null || true)
              if [ -n \"\${PID:-}\" ] && [ \"\$PID\" != \"0\" ] && [ -r \"/proc/\$PID/environ\" ]; then
                TMP_ENV=\$(mktemp)
                tr '\\0' '\\n' < \"/proc/\$PID/environ\" > \"\$TMP_ENV\"
                chmod 600 \"\$TMP_ENV\"
                ENV_FILE=\$TMP_ENV
              fi
            fi
            if [ -z \"\$ENV_FILE\" ]; then
              echo 'ereport-import: cannot load api env (file 600 root, no sudo cat, no /proc environ)' >&2
              ls -la /etc/eduardoos-api.env /etc/eduardoos.com-api.env 2>&1 || true
              id
              exit 1
            fi
            set -a
            # shellcheck disable=SC1090
            . \"\$ENV_FILE\"
            set +a
            if [ -n \"\${TMP_ENV:-}\" ]; then rm -f \"\$TMP_ENV\"; fi
            if [ -z \"\${MONGODB_URI:-}\${MONGO_URI:-}\" ]; then
              echo 'ereport-import: MONGODB_URI/MONGO_URI unset after sourcing env' >&2
              exit 1
            fi
            \"\$API\" ereport-import \
              --email='${IMPORT_EMAIL}' \
              --meta='${REMOTE_DIR}/meta.json' \
              --payload='${REMOTE_DIR}/report.json' \
              --org-name='${ORG_NAME}' \
              --root=/var/www/${SITE}/media/ereport
            rm -rf '${REMOTE_DIR}'
            curl --fail --silent --show-error http://127.0.0.1:8081/health
            echo
          "
