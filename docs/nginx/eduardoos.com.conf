# Private avatars and eReport files are not served from a public /media/ location.
# Go authorizes GET /api/profile/avatar and eReport image/report handlers, then
# Nginx delivers files internally with X-Accel-Redirect.
# CI/CD may --delete only /var/www/eduardoos.com/html/. Never delete
# /var/www/eduardoos.com/media/ or /var/www/eduardoos.com/media/ereport/.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eduardoos.com;

    root /var/www/eduardoos.com/html;
    index index.html;
    autoindex off;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    location /internal-media/ {
        internal;
        alias /var/www/eduardoos.com/media/;
    }

    location = /ereport-tracker.html {
        try_files /ereport-tracker.html =404;
    }

    location = /ereport {
        try_files /ereport/index.html =404;
    }

    location = /ereport/workspace {
        try_files /ereport/workspace/index.html =404;
    }

    location = /ereport/invite {
        try_files /ereport/invite/index.html =404;
    }

    location = /api-docs {
        try_files /api-docs/index.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name eduardoos.com www.eduardoos.com;
    return 301 https://eduardoos.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.eduardoos.com;
    return 301 https://eduardoos.com$request_uri;
}
