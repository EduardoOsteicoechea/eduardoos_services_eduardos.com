# Private avatars are not served from a public /media/ location.
# Go authorizes GET /api/profile/avatar then Nginx delivers the file internally.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eduardoos.com;

    root /var/www/eduardoos.com/html;
    index index.html;
    autoindex off;

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /internal-media/ {
        internal;
        alias /var/www/eduardoos.com/media/;
    }

    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name eduardoos.com www.eduardoos.com;
    return 301 https://eduardoos.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.eduardoos.com;
    return 301 https://eduardoos.com$request_uri;
}
