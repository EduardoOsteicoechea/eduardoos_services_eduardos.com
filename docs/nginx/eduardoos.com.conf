# Private avatars and eReport files are not served from a public /media/ location.
# Go authorizes GET /api/profile/avatar and eReport image/report handlers, then
# Nginx delivers files internally with X-Accel-Redirect.
# CI/CD may --delete only /var/www/eduardoos.com/html/. Never delete
# /var/www/eduardoos.com/media/ or /var/www/eduardoos.com/media/ereport/.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eduardoos.com;

    root /var/www/eduardoos.com/html;
    index index.html;
    autoindex off;
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        client_max_body_size 100m;
    }

    location /internal-media/ {
        internal;
        alias /var/www/eduardoos.com/media/;
    }

    location = /ereport-tracker.html {
        try_files /ereport-tracker.html =404;
    }

    location = /ereport {
        try_files /ereport/index.html =404;
    }

    location = /ereport/workspace {
        try_files /ereport/workspace/index.html =404;
    }

    location = /ereport/invite {
        try_files /ereport/invite/index.html =404;
    }

    # Tracker alias. Exact match so the pretty-hub regex below can never shadow it.
    location = /ereport/tracker.html {
        try_files /ereport/tracker.html =404;
    }

    location = /api-docs {
        try_files /api-docs/index.html =404;
    }

    # Invite links may carry the id as a path segment: /ereport/invite/{inviteId}
    location ~ "^/ereport/invite/[^/]+$" {
        try_files /ereport/invite/index.html =404;
    }

    # Pretty hub /ereport/{ownerSafe}. Display only: the API still authorizes from
    # the session user id (072), never from this segment.
    location ~ "^/ereport/(?!workspace$|invite$|tracker\.html$)[^/]+$" {
        try_files /ereport/index.html =404;
    }

    # Pretty workspace /ereport/{ownerSafe}/{reportId}.
    location ~ "^/ereport/(?!workspace/|invite/)[^/]+/[^/]+$" {
        try_files /ereport/workspace/index.html =404;
    }


    # eostore storefront pretty URLs (legacy bookmarks)
    location ~ ^/store/[^/]+/cart/?$ {
        try_files /store/company/cart/index.html /store/company/cart.html =404;
    }

    location ~ ^/store/[^/]+/?$ {
        try_files /store/company/index.html /store/company.html =404;
    }
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name eduardoos.com www.eduardoos.com;
    return 301 https://eduardoos.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.eduardoos.com;
    return 301 https://eduardoos.com$request_uri;
}
